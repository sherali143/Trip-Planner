[tool.poetry]
name = "trip-planner"
version = "0.2.0"
description = "AI trip planner with A2A protocol and MCP integration"
authors = ["x"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<=3.13"
crewai = {version = "*", extras = ["tools"]}
litellm = "*"
mcp = "*"
python-dotenv = "*"
requests = "*"
pydantic = "*"
pyyaml = "*"
setuptools = "*"
langchain = "*"
streamlit = "*"
pytest = "*"

[tool.poetry.group.dev.dependencies]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"