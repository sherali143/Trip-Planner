# Tooling configuration only.
#
# Dependencies live in requirements.txt, which is PINNED to the exact versions
# the published evaluation results were produced with. This file used to carry
# a parallel [tool.poetry.dependencies] list with every version as "*", so
# installing via poetry produced a different (and untested) dependency set than
# installing via pip. One source of truth avoids that drift.

[tool.pytest.ini_options]
# `testing/manual/` holds ad-hoc API probe scripts, not tests. They are named
# test_*.py so pytest collects them by default, and importing them fails (they
# call live endpoints and exit() at module scope) — which aborted the entire
# session and left `pytest testing/` collecting zero tests.
testpaths = ["testing"]
norecursedirs = ["manual", ".venv", "__pycache__", ".api_cache", ".git"]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".venv", ".api_cache", "**/__pycache__"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']
