# Test configuration.
#
# Dependencies are NOT here. They live in requirements.txt, pinned to the exact
# versions the published evaluation results were produced with. This file used
# to carry a parallel dependency list with every version as "*", so installing
# via poetry produced a different and untested dependency set than installing
# via pip. One source of truth avoids that drift.
#
# Configuration for ruff and pyright was removed: neither tool is installed and
# neither is in requirements.txt, so it was settings for linters nobody runs.

[tool.pytest.ini_options]
# Collect only from testing/. Every file there is a real test with real
# assertions — ad-hoc API probe scripts were removed rather than left beside
# them, because named test_*.py they were collected by pytest, asserted
# nothing, and called live endpoints.
testpaths = ["testing"]

# Never descend into these. .api_cache in particular holds a 2 MB recorded
# response that pytest has no reason to walk.
norecursedirs = [".venv", "__pycache__", ".api_cache", ".git", ".pytest_cache"]
