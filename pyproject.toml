# pytest configuration. Nothing else.
#
# Dependencies live in requirements.txt, pinned to the exact versions the
# published results were produced with. This file used to carry a second
# dependency list with every version as "*", so installing with poetry gave a
# different and untested set than installing with pip.

[tool.pytest.ini_options]
# Where the tests are. Without this, pytest searches the whole tree from the
# working directory, which works but walks the 2 MB response cache on the way.
testpaths = ["trip_planner/tests"]

# Never descend into these.
norecursedirs = [".venv", "__pycache__", ".api_cache", ".git", ".pytest_cache"]
