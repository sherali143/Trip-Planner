# Trip Planner Configuration
# Agent Settings and Search Tools Configuration

# ===========================================
# AGENT CONFIGURATION
# ===========================================

agents:
  conversational_agent:
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 2000
    enabled: true
  
  preferences_extractor:
    model: "gpt-4"
    temperature: 0.3
    max_tokens: 1500
    enabled: true
  
  flight_search_agent:
    model: "gpt-4"
    temperature: 0.5
    max_tokens: 2000
    enabled: true
  
  hotel_agent:
    model: "gpt-4"
    temperature: 0.5
    max_tokens: 2000
    enabled: true
  
  attraction_agent:
    model: "gpt-4"
    temperature: 0.6
    max_tokens: 2500
    enabled: true
  
  itinerary_coordinator:
    model: "gpt-4"
    temperature: 0.6
    max_tokens: 4000
    enabled: true

# ===========================================
# A2A PROTOCOL CONFIGURATION
# ===========================================

a2a_protocol:
  message_timeout: 60
  max_retries: 3
  enable_logging: true
  log_level: "INFO"
  queue_size: 100

# ===========================================
# BUDGET ALLOCATION DEFAULTS
# ===========================================

budget_defaults:
  flights_percentage: 0.40
  accommodation_percentage: 0.30
  activities_percentage: 0.20
  meals_percentage: 0.10
  
  luxury:
    accommodation_percentage: 0.40
    meals_percentage: 0.15
  budget:
    accommodation_percentage: 0.20
    activities_percentage: 0.25

# ===========================================
# SEARCH TOOLS CONFIGURATION
# ===========================================

search_tools:
  serper_api:
    enabled: true
    max_results: 5
  
  calculator:
    enabled: true
    precision: 2

# ===========================================
# GENERAL SETTINGS
# ===========================================

general:
  verbose: true
  enable_a2a_tracking: true
  max_conversation_turns: 10
  default_currency: "USD"
  date_format: "YYYY-MM-DD"
