services:
  trip-planner:
    # Build context is the project root, one level up, because the
    # image needs src/, comparison/ and .api_cache/ — not just this folder.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ai-trip-planner
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      # Replay recorded API responses by default. The flight and hotel free
      # tiers are monthly and tiny (30 and 50 calls), so a container restart
      # loop must not be able to spend them.
      TRIP_PLANNER_API_MODE: "${TRIP_PLANNER_API_MODE:-replay}"
      TRIP_PLANNER_MAX_LIVE_CALLS: "${TRIP_PLANNER_MAX_LIVE_CALLS:-10}"
    volumes:
      # Recorded API responses, so the cache survives rebuilds and any
      # newly recorded calls persist to the host. The previous mount pointed
      # at ./.cache, which no longer exists — it was the old QueryCache
      # directory, removed when caching moved to the HTTP layer.
      - ../.api_cache:/app/.api_cache
    restart: unless-stopped
